<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bat Ball Stump Game</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Bat Ball Stump Game</h1>

  <div>
    <button onclick="playGame('Bat')">Bat</button>
    <button onclick="playGame('Ball')">Ball</button>
    <button onclick="playGame('Stump')">Stump</button>
  </div>

  <script>

    function playGame(userChoice) {

      // Generate random number between 0 and 3
      let randomNumber = Math.random() * 3;

      let computerChoice;

      // Decide computer choice
      if (randomNumber > 0 && randomNumber <= 1) {
        computerChoice = 'Bat';

      } else if (randomNumber > 1 && randomNumber <= 2) {
        computerChoice = 'Ball';

      } else {
        computerChoice = 'Stump';
      }

      // Decide result
      let resultMsg;

      if (userChoice === computerChoice) {
        resultMsg = "It's a tie";

      } else if (
        (userChoice === 'Bat' && computerChoice === 'Ball') ||
        (userChoice === 'Ball' && computerChoice === 'Stump') ||
        (userChoice === 'Stump' && computerChoice === 'Bat')
      ) {
        resultMsg = 'User won';

      } else {
        resultMsg = 'Computer won';
      }

      // Show result
      alert(
        `You chose ${userChoice}. Computer chose ${computerChoice}. ${resultMsg}`
      );
    }

  </script>

</body>
</html>
